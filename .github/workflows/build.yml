name: Build

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Runs solutions, practice-project tests and the lesson output check.
      # Exercise tests are excluded on purpose: they fail until a learner solves them.
      - name: Test
        run: ./gradlew test --console=plain
